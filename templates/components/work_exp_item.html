<div class="timeline-item" id="exp-{{ exp.pk }}">
  <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;">
    <div>
      <div class="timeline-title">{{ exp.title }}</div>
      <div class="timeline-sub">{{ exp.company }}{% if exp.location %} · {{ exp.location }}{% endif %}</div>
      <div class="timeline-date">{{ exp.start_date|date:"M Y" }} — {% if exp.is_current %}Present{% elif exp.end_date %}{{ exp.end_date|date:"M Y" }}{% else %}—{% endif %}</div>
      {% if exp.description %}<div class="timeline-desc">{{ exp.description|linebreaksbr }}</div>{% endif %}
    </div>
    <button class="btn btn-xs" style="flex:0 0 auto;background:transparent;border:1px solid var(--border);color:var(--faint);"
            hx-post="{% url 'delete_work_experience' exp.pk %}"
            hx-target="#exp-{{ exp.pk }}"
            hx-swap="outerHTML"
            hx-confirm="Delete this experience?"
            hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/></svg>
    </button>
  </div>
</div>
