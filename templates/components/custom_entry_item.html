<div class="timeline-item" id="custom-{{ entry.pk }}">
  <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;">
    <div>
      <div class="timeline-title">{{ entry.title }}</div>
      {% if entry.date %}<div class="timeline-date">{{ entry.date|date:"M Y" }}</div>{% endif %}
      {% if entry.description %}<div class="timeline-desc">{{ entry.description|linebreaksbr }}</div>{% endif %}
    </div>
    <button class="btn btn-xs" style="flex:0 0 auto;background:transparent;border:1px solid var(--border);color:var(--faint);"
            hx-post="{% url 'delete_custom_entry' entry.pk %}"
            hx-confirm="Delete this entry?"
            hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/></svg>
    </button>
  </div>
</div>
