{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ApplyMate — AI-Powered Job Application Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
<div class="landing-page">
  <div style="position:fixed;inset:0;background:radial-gradient(ellipse 60% 80% at 50% 0%,rgba(16,185,129,0.12),transparent 70%);pointer-events:none;"></div>
  <div class="landing-card">
    <div class="landing-logo">
      <div class="landing-logo-icon">A</div>
      <div style="font-size:28px;font-weight:800;letter-spacing:-0.03em;">Apply<span style="color:var(--accent);">Mate</span></div>
    </div>
    <p class="landing-sub">AI-powered job application assistant that crafts tailored resumes, cover letters, and tracks your entire job search — all in one place.</p>

    <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:24px;">
      <a href="{% url 'account_signup' %}" class="btn btn-primary" style="justify-content:center;height:48px;font-size:15px;">
        Get Started Free
      </a>
      <a href="{% url 'account_login' %}" class="btn btn-secondary" style="justify-content:center;height:48px;font-size:15px;">
        Sign In
      </a>
    </div>

    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;border-top:1px solid var(--border);padding-top:20px;">
      <div style="text-align:center;">
        <div style="font-size:22px;font-weight:800;font-family:'JetBrains Mono',monospace;color:var(--accent);">AI</div>
        <div style="font-size:12px;color:var(--faint);margin-top:2px;">Resume & Cover Letter</div>
      </div>
      <div style="text-align:center;">
        <div style="font-size:22px;font-weight:800;font-family:'JetBrains Mono',monospace;color:var(--accent);">📊</div>
        <div style="font-size:12px;color:var(--faint);margin-top:2px;">Kanban Tracking</div>
      </div>
      <div style="text-align:center;">
        <div style="font-size:22px;font-weight:800;font-family:'JetBrains Mono',monospace;color:var(--accent);">💬</div>
        <div style="font-size:12px;color:var(--faint);margin-top:2px;">Per-Job Chat</div>
      </div>
    </div>
  </div>
</div>
<script src="{% static 'js/main.js' %}"></script>
</body>
</html>
